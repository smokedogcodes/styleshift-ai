<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c08b5c"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="240" rx="24" fill="url(#bg)"/>
  <ellipse cx="100" cy="230" rx="52" ry="18" fill="#27272a" opacity="0.55"/>
  <!-- neck -->
  <path d="M78 175 Q100 190 122 175 L118 210 Q100 218 82 210 Z" fill="url(#skin)"/>
  <!-- face -->
  <ellipse cx="100" cy="130" rx="42" ry="52" fill="url(#skin)"/>
  <!-- eyes -->
  <ellipse cx="84" cy="125" rx="4" ry="3.5" fill="#27272a"/>
  <ellipse cx="116" cy="125" rx="4" ry="3.5" fill="#27272a"/>
  <!-- nose -->
  <path d="M100 128 L97 142 Q100 145 103 142 Z" fill="#b07a4e" opacity="0.7"/>
  <!-- lips -->
  <path d="M92 155 Q100 161 108 155" fill="none" stroke="#a86b55" stroke-width="2.5" stroke-linecap="round"/>
  <!-- hair -->
   + hairPaths + 
</svg>